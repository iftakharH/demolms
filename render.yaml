# Render blueprint - infra as code for the demo deployment.
#
# Use it from the Render Dashboard: New -> Blueprint -> pick this repo. Render reads
# this file and creates the service, the disk and the environment variables in one go,
# which is far less error-prone than ten manual dashboard steps.
#
# NOT YET EXERCISED against Render's validator: the YAML parses and the values come
# from Render's own docs (see DEPLOY.md), but the first deploy through this file is
# itself the test. The manual runbook in DEPLOY.md is the fallback.
#
# Notes:
# - `plan: starter` is the cheapest instance type that can attach a disk.
# - The disk must live at /opt/render/project/src/data: that is this app's `data/`
#   directory under Render's Node source path. Mount it anywhere else and the SQLite
#   file is not actually on the disk.
# - The database seeds itself on first boot (src/instrumentation.ts), so no shell step
#   is needed after the first deploy. The `prebuild` step runs on separate compute,
#   where the disk is not mounted.
# - SESSION_SECRET and PAYMENT_WEBHOOK_SECRET are generated by Render (`generateValue`),
#   so real values never live in the repo.

services:
  - type: web
    name: demolms
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: demolms-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      # Set APP_URL to the service's own URL (or your custom domain) after the first
      # deploy: it is used in metadata, the sitemap and the links inside emails.
      - key: APP_URL
        value: https://demolms.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      # Uncomment to hide the on-screen MFA code, the demo-account quick-fill buttons
      # and the footer outbox link on a public URL:
      # - key: DEMO_HIDE_DEV_TOOLS
      #   value: "true"
